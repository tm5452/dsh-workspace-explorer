name: build-check

on:
  push:
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild the client bundle
        run: node scripts/build-client.mjs

      - name: Fail when lib/client.js is out of date
        run: |
          if ! git diff --exit-code -- lib/client.js; then
            echo "::error file=lib/client.js::lib/client.js 与 src/ 不同步。本地跑 node scripts/build-client.mjs 后把产物一起提交。"
            exit 1
          fi

      - name: Verify the package manifest parses
        run: node -e "const p=require('./package.json'); if(!p.dsh||!p.dsh.bundle) { console.error('package.json 缺少 dsh.bundle 声明'); process.exit(1) } console.log('manifest ok:', p.name, p.version)"
